name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Menambahkan tombol run manual

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create Dummy google-services.json
      run: |
        echo '{"project_info":{"project_number":"1","project_id":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:1:android:1","android_client_info":{"package_name":"com.dummy.app"}},"api_key":[{"current_key":"dummy"}]}]}' > app/google-services.json

        - name: Generate Dummy debug.keystore
      run: |
        rm -f debug.keystore
        keytool -genkey -v -keystore debug.keystore -storetype JKS -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
        
    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
